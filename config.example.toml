# Use an API base URL (including /v1) or the complete API endpoint URL.
listen = "127.0.0.1:8787"

[[models]]
name = "a0-qwen"
model = "qwen3-coder-480b-a35b-instruct-turbo"
base_url = "https://llm.agent-zero.ai/v1"
api = "chat"
api_key_env = "AGENT_ZERO_API_KEY"
context_window = 262144
# api_key = "..."                 # Alternative to api_key_env
# drop_params = ["reasoning_effort"]
[models.params]
temperature = 0.2
[models.params.venice_parameters]
include_venice_system_prompt = false

[[models]]
name = "a0-deepseek"
model = "deepseek-v3.2"
base_url = "https://llm.agent-zero.ai/v1"
api = "chat"
api_key_env = "AGENT_ZERO_API_KEY"
context_window = 160000
reasoning_efforts = ["low", "medium", "high"]
[models.params.venice_parameters]
include_venice_system_prompt = false

